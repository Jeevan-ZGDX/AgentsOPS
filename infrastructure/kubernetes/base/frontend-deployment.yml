apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentops-frontend
  namespace: agentops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agentops-frontend
  template:
    metadata:
      labels:
        app: agentops-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/agentops/frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.agentops.ai/api/v1"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: agentops-frontend
  namespace: agentops
spec:
  selector:
    app: agentops-frontend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentops-ingress
  namespace: agentops
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: app.agentops.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentops-frontend
                port:
                  number: 3000
    - host: api.agentops.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentops-backend
                port:
                  number: 8000
  tls:
    - hosts:
        - app.agentops.ai
        - api.agentops.ai
      secretName: agentops-tls
