apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentops-backend
  namespace: agentops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agentops-backend
  template:
    metadata:
      labels:
        app: agentops-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/agentops/backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agentops-secrets
                  key: database-url
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: CELERY_BROKER_URL
              value: "redis://redis:6379/1"
            - name: CELERY_RESULT_BACKEND
              value: "redis://redis:6379/2"
            - name: ENVIRONMENT
              value: "production"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agentops-backend
  namespace: agentops
spec:
  selector:
    app: agentops-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
