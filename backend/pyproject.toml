[project]
name = "agentops-backend"
version = "0.1.0"
description = "AgentOps Backend - Multi-Agent Startup Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.1",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "openai>=1.12.0",
    "langgraph>=0.0.40",
    "langchain-core>=0.1.40",
    "langchain-openai>=0.0.8",
    "llama-index>=0.9.48",
    "chromadb>=0.4.22",
    "celery>=5.3.6",
    "flower>=2.0.1",
    "reportlab>=4.0.8",
    "python-pptx>=0.6.23",
    "jinja2>=3.1.3",
    "weasyprint>=60.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-instrumentation-fastapi>=0.42b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.42b0",
    "opentelemetry-instrumentation-redis>=0.42b0",
    "opentelemetry-exporter-otlp>=1.22.0",
    "python-dotenv>=1.0.0",
    "email-validator>=2.1.0",
    "pydantic-extra-types>=2.4.0",
    "python-dateutil>=2.8.2",
    "croniter>=2.0.0",
    "tenacity>=8.2.3",
    "orjson>=3.9.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.26.0",
    "faker>=22.0.0",
    "factory-boy>=3.3.0",
    "ruff>=0.1.14",
    "mypy>=1.7.1",
    "black>=23.12.1",
    "isort>=5.13.2",
    "pre-commit>=3.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20", "PIE"]
ignore = ["S101", "S311", "S603", "S607"]
per-file-ignores = { "tests/*" = ["S101", "S311"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"